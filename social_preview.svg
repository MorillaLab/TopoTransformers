<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1f2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f8ef7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4f8ef7;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#4f8ef7;stop-opacity:0" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Glow orbs -->
  <ellipse cx="200" cy="200" rx="300" ry="200" fill="#4f8ef7" opacity="0.06" filter="url(#blur)"/>
  <ellipse cx="1100" cy="450" rx="280" ry="200" fill="#a855f7" opacity="0.07" filter="url(#blur)"/>

  <!-- Grid lines (subtle) -->
  <g stroke="#ffffff" stroke-width="0.3" opacity="0.04">
    <line x1="0" y1="128" x2="1280" y2="128"/>
    <line x1="0" y1="256" x2="1280" y2="256"/>
    <line x1="0" y1="384" x2="1280" y2="384"/>
    <line x1="0" y1="512" x2="1280" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="640"/>
    <line x1="512" y1="0" x2="512" y2="640"/>
    <line x1="768" y1="0" x2="768" y2="640"/>
    <line x1="1024" y1="0" x2="1024" y2="640"/>
  </g>

  <!-- Topological network decoration (right side) -->
  <!-- Nodes -->
  <circle cx="920" cy="180" r="6" fill="#4f8ef7" opacity="0.7"/>
  <circle cx="1010" cy="130" r="5" fill="#a855f7" opacity="0.7"/>
  <circle cx="1080" cy="200" r="7" fill="#4f8ef7" opacity="0.8"/>
  <circle cx="1000" cy="260" r="5" fill="#7c3aed" opacity="0.6"/>
  <circle cx="1120" cy="310" r="6" fill="#a855f7" opacity="0.7"/>
  <circle cx="960" cy="330" r="4" fill="#4f8ef7" opacity="0.5"/>
  <circle cx="870" cy="280" r="5" fill="#6366f1" opacity="0.6"/>
  <circle cx="1170" cy="200" r="4" fill="#a855f7" opacity="0.5"/>
  <circle cx="1150" cy="140" r="5" fill="#4f8ef7" opacity="0.6"/>
  <circle cx="850" cy="150" r="4" fill="#7c3aed" opacity="0.5"/>
  <circle cx="1200" cy="380" r="5" fill="#4f8ef7" opacity="0.4"/>
  <circle cx="1050" cy="390" r="4" fill="#a855f7" opacity="0.5"/>
  <!-- Edges -->
  <g stroke="#4f8ef7" stroke-width="1.2" opacity="0.3" fill="none">
    <line x1="920" y1="180" x2="1010" y2="130"/>
    <line x1="1010" y1="130" x2="1080" y2="200"/>
    <line x1="1080" y1="200" x2="1000" y2="260"/>
    <line x1="920" y1="180" x2="1000" y2="260"/>
    <line x1="1080" y1="200" x2="1120" y2="310"/>
    <line x1="1000" y1="260" x2="960" y2="330"/>
    <line x1="960" y1="330" x2="870" y2="280"/>
    <line x1="870" y1="280" x2="920" y2="180"/>
    <line x1="1080" y1="200" x2="1170" y2="200"/>
    <line x1="1170" y1="200" x2="1150" y2="140"/>
    <line x1="1150" y1="140" x2="1010" y2="130"/>
    <line x1="1120" y1="310" x2="1200" y2="380"/>
    <line x1="1120" y1="310" x2="1050" y2="390"/>
    <line x1="850" y1="150" x2="920" y2="180"/>
    <line x1="1170" y1="200" x2="1200" y2="380"/>
  </g>
  <!-- Triangle fill (persistent loop) -->
  <polygon points="920,180 1010,130 1080,200 1000,260" fill="#4f8ef7" opacity="0.05"/>
  <polygon points="1010,130 1150,140 1170,200 1080,200" fill="#a855f7" opacity="0.05"/>

  <!-- Accent line under title -->
  <rect x="80" y="310" width="440" height="3" rx="2" fill="url(#accent)"/>

  <!-- Main title -->
  <text x="80" y="280" font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="72" font-weight="700" fill="white" letter-spacing="-1">
    TopoAttention
  </text>

  <!-- Subtitle -->
  <text x="82" y="358" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="22" fill="#94a3b8" letter-spacing="0.5">
    Topological Transformers for Lung Transplant Mortality Prediction
  </text>

  <!-- Stats row -->
  <!-- Stat 1 -->
  <rect x="80" y="410" width="170" height="80" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#4f8ef7" stroke-width="1" stroke-opacity="0.4"/>
  <text x="165" y="445" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="28" font-weight="700" fill="#4f8ef7" text-anchor="middle">87.4%</text>
  <text x="165" y="472" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="13" fill="#94a3b8" text-anchor="middle">Accuracy</text>

  <!-- Stat 2 -->
  <rect x="270" y="410" width="170" height="80" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.4"/>
  <text x="355" y="445" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="28" font-weight="700" fill="#a855f7" text-anchor="middle">84.1%</text>
  <text x="355" y="472" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="13" fill="#94a3b8" text-anchor="middle">Sensitivity</text>

  <!-- Stat 3 -->
  <rect x="460" y="410" width="170" height="80" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4"/>
  <text x="545" y="445" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="28" font-weight="700" fill="#818cf8" text-anchor="middle">89.6%</text>
  <text x="545" y="472" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="13" fill="#94a3b8" text-anchor="middle">Specificity</text>

  <!-- Stat 4 -->
  <rect x="650" y="410" width="130" height="80" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#4f8ef7" stroke-width="1" stroke-opacity="0.4"/>
  <text x="715" y="445" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="28" font-weight="700" fill="#4f8ef7" text-anchor="middle">0.91</text>
  <text x="715" y="472" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="13" fill="#94a3b8" text-anchor="middle">AUC</text>

  <!-- Tags -->
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="13">
    <rect x="80" y="515" width="145" height="28" rx="14" fill="#4f8ef7" fill-opacity="0.15" stroke="#4f8ef7" stroke-width="1" stroke-opacity="0.5"/>
    <text x="153" y="533" fill="#93c5fd" text-anchor="middle">🔬 Topological TDA</text>

    <rect x="238" y="515" width="135" height="28" rx="14" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5"/>
    <text x="305" y="533" fill="#d8b4fe" text-anchor="middle">🤖 Transformers</text>

    <rect x="386" y="515" width="160" height="28" rx="14" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="1" stroke-opacity="0.5"/>
    <text x="466" y="533" fill="#a5b4fc" text-anchor="middle">🫁 Lung Transplant</text>

    <rect x="559" y="515" width="130" height="28" rx="14" fill="#4f8ef7" fill-opacity="0.15" stroke="#4f8ef7" stroke-width="1" stroke-opacity="0.5"/>
    <text x="624" y="533" fill="#93c5fd" text-anchor="middle">💡 SHAP XAI</text>
  </g>

  <!-- Bottom label -->
  <text x="80" y="600" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="14" fill="#475569">
    MorillaLab · medRxiv 2025 · GPL-3.0
  </text>
</svg>
